<!DOCTYPE html>
<html lang="en">

<head>
    <title>Search</title>
    <style>
        header {
            display: flex;
            justify-content: space-between;
            font-family: Arial, Helvetica, sans-serif;
            padding: 10px;
            font-size: 20px;
            margin: 10px;
            
          
        }
        header a{
            display: flex;
            align-items: center;
        }
        h1,h2{
            font-family: Arial, Helvetica, sans-serif;
        }
        header a {
            text-decoration: none;
            color: black;
        }

        header a:hover {
            color: blue;
        }

        

        #search {
            width: 500px;
            height: 30px;
            font-size: 16px;
            padding: 5px;
            border-radius: 30px;
            background-color: aliceblue;
            border: none;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;

        }

        .buttons {
            display: inline-block;
        }

        .buttons input,
        .buttons button {
            display: inline-block;
            padding: 10px 15px;
            border: 1px solid #dcdcdc;
            border-radius: 4px;
            background-color: #f8f9fa;
            cursor: pointer;
        }

        img {
            width: 100px;
        }
        main{
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 20px;
            margin: 20px;
            
        }
        form div{
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            justify-content: space-between;
            
        }
        input{
            height: 30px;
            width: 100%;
            border: 1px solid #dcdcdc;
            border-radius: 4px;
            background-color: #f8f9fa;
            padding: 5px;
        }
        label{
            width: 300px;
            font-family: Arial, Helvetica, sans-serif;
        }
        .buttons {
            
            width: 50%;
            border-radius: 50px;
            
            padding: 10px;
            align-items: center;
            gap: 10px;
        }
        .buttons input{
            display: flex;
            justify-content:end;
            background-color:cornflowerblue;
            padding: 0px;
            color: white;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <header>
        <img src="Google-logo.png" alt="logo">
        <a href="index.html">Search</a>
    </header>
    <main>
        <h1>Advanced Search</h1>
        <h2>Find pages with</h2>
        <form action="https://google.com/search">
            <div>
                <label for="allthesewords">all these words:</label>
                <input id="allthesewords" type="text" name="as_q">
            </div>
            <div>
                <label for="anyofthese">any of these words:</label>
                <input id="anyofthese" type="text" name="as_epq">
            </div>
            <div>
                <label for="exactphrase">the exact phrase:</label>
                <input id="exactphrase" type="text" name="as_eq">
            </div>
            <div>
                <label for="withoutthese">without these words:</label>
                <input id="withoutthese" type="text" name="as_sitesearch">
            </div>
            

            <div class="buttons">
                <input type="submit" value="Advanced Search">

            </div>
        </form>
    </main>

</body>

</html>
